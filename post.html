<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog</title>
<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    var stored = localStorage.getItem("blog-theme");
    var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-title" href="index.html">📝 Blog</a>
      <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">🌙</button>
    </div>
  </header>

  <main>
    <a class="back-link" href="index.html">← 목록으로</a>

    <article>
      <header class="post-header">
        <h1 id="post-title"></h1>
        <div class="post-meta">
          <time id="post-date"></time>
          <div id="post-tags"></div>
        </div>
      </header>
      <div id="post-content" class="post-content"></div>
    </article>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/highlight.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/post.js"></script>
</body>
</html>
